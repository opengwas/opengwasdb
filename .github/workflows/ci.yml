name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: tests, lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The package's version comes from the `v*` tags (issue #333), so a
          # tagless clone builds `0.1.dev1+...` and tests/test_version.py --
          # which compares the installed version to `git describe` -- fails.
          fetch-depth: 0
          fetch-tags: true

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: dev
          cache: true

      # Baselines before tests: a lint or type regression is cheaper to read
      # than a test failure caused by one.
      - name: Tooling baselines
        run: pixi run -e dev python scripts/check_baselines.py

      - name: Cleat quality gates
        run: pixi run -e dev python quality/bin/gate.py

      - name: Tests
        run: pixi run -e dev test

      # The version is built from the tag, and only a real install shows it:
      # a tagless checkout builds a development version off the wrong base and a
      # checkout without git metadata reports the `0.0.0+unknown` fallback.
      # tests/test_version.py cannot assert this, because its answer depends on
      # whether the *environment* was rebuilt since the last commit, so it is
      # checked here, where pixi has just built the editable package from this
      # checkout and `fetch-depth: 0` has brought the tags.
      - name: The installed version comes from the tags
        run: |
          pixi run -e dev python - <<'PY'
          import subprocess
          import sys

          from packaging.version import Version

          import opengwasdb
          from opengwasdb.version import FALLBACK_VERSION

          reported = opengwasdb.__version__
          if reported == FALLBACK_VERSION:
              sys.exit(
                  f"the build found no git metadata: the package reports {reported}"
              )
          tags = subprocess.run(
              ["git", "tag", "--list", "v*"], capture_output=True, text=True, check=True
          ).stdout.split()
          if not tags:
              sys.exit("this checkout has no v* tag, so the version cannot be checked")
          newest = max(tags, key=lambda tag: Version(tag[1:]))
          if Version(reported) < Version(newest[1:]):
              sys.exit(
                  f"the installed version {reported} is older than the newest tag "
                  f"{newest}; the environment was not rebuilt from this checkout"
              )
          print(f"installed version {reported}, newest tag {newest}")
          PY

  # What a `pip install opengwasdb` user gets, built and checked the way a
  # release will build it (#438): the source archive first, then the wheel
  # from that archive, so a file the archive leaves out breaks the wheel here
  # rather than for a user. No Pixi: the build environment is a bare Python
  # with the two build tools pinned.
  distributions:
    name: build and check distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The version is derived from the `v*` tags (#333).
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the source archive, and the wheel from it
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build --outdir dist .

      - name: The metadata renders
        run: python -m twine check --strict dist/*

      - name: The archives hold what the repository says they hold
        run: python scripts/check_distributions.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  # The wheel above, installed into a clean environment outside the checkout
  # on every Python `pyproject.toml` advertises, and used the way
  # docs/getting-started.md uses it. The checkout supplies only the smoke-test
  # script and the tiny fixture, which the script copies out before building;
  # `-I` keeps the checkout off the import path, and the script refuses a
  # package imported from anywhere but the environment's site-packages.
  installed-wheel:
    name: installed wheel, Python ${{ matrix.python }}
    needs: distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: ${{ runner.temp }}/dist

      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl
          "$RUNNER_TEMP/venv/bin/python" -m pip check

      - name: Use the installed package from outside the checkout
        run: |
          wheel=$(basename "$RUNNER_TEMP"/dist/*.whl)
          version=$(echo "$wheel" | cut -d- -f2)
          mkdir "$RUNNER_TEMP/run"
          cd "$RUNNER_TEMP/run"
          "$RUNNER_TEMP/venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_test_installed.py" \
            --fixture "$GITHUB_WORKSPACE/docs/examples/tiny" \
            --version "$version"

  changelog:
    name: changelog fragment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs against the merge base, which needs real history.
          fetch-depth: 0

      # The labels reach the check as `--labels`, so the `no-changelog`
      # exemption is decided and tested in scripts/check_changelog.py rather
      # than by skipping the job: a skipped job cannot report why.
      - name: A fragment added alongside source changes
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          python scripts/check_changelog.py \
            --base-ref "origin/${{ github.event.pull_request.base.ref }}" \
            --labels "$LABELS"
