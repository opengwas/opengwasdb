name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: tests, lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The package's version comes from the `v*` tags (issue #333), so a
          # tagless clone builds `0.1.dev1+...` and tests/test_version.py --
          # which compares the installed version to `git describe` -- fails.
          fetch-depth: 0
          fetch-tags: true

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: dev
          cache: true

      # Baselines before tests: a lint or type regression is cheaper to read
      # than a test failure caused by one.
      - name: Tooling baselines
        run: pixi run -e dev python scripts/check_baselines.py

      - name: Cleat quality gates
        run: pixi run -e dev python quality/bin/gate.py

      - name: Tests
        run: pixi run -e dev test

      # The version is built from the tag, and only a real install shows it:
      # a tagless checkout builds a development version off the wrong base and a
      # checkout without git metadata reports the `0.0.0+unknown` fallback.
      # tests/test_version.py cannot assert this, because its answer depends on
      # whether the *environment* was rebuilt since the last commit, so it is
      # checked here, where pixi has just built the editable package from this
      # checkout and `fetch-depth: 0` has brought the tags.
      - name: The installed version comes from the tags
        run: |
          pixi run -e dev python - <<'PY'
          import subprocess
          import sys

          from packaging.version import Version

          import opengwasdb
          from opengwasdb.version import FALLBACK_VERSION

          reported = opengwasdb.__version__
          if reported == FALLBACK_VERSION:
              sys.exit(
                  f"the build found no git metadata: the package reports {reported}"
              )
          tags = subprocess.run(
              ["git", "tag", "--list", "v*"], capture_output=True, text=True, check=True
          ).stdout.split()
          if not tags:
              sys.exit("this checkout has no v* tag, so the version cannot be checked")
          newest = max(tags, key=lambda tag: Version(tag[1:]))
          if Version(reported) < Version(newest[1:]):
              sys.exit(
                  f"the installed version {reported} is older than the newest tag "
                  f"{newest}; the environment was not rebuilt from this checkout"
              )
          print(f"installed version {reported}, newest tag {newest}")
          PY

  changelog:
    name: changelog fragment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs against the merge base, which needs real history.
          fetch-depth: 0

      # The labels reach the check as `--labels`, so the `no-changelog`
      # exemption is decided and tested in scripts/check_changelog.py rather
      # than by skipping the job: a skipped job cannot report why.
      - name: A fragment added alongside source changes
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          python scripts/check_changelog.py \
            --base-ref "origin/${{ github.event.pull_request.base.ref }}" \
            --labels "$LABELS"
