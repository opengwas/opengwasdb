[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "opengwasdb"
dynamic = ["version"]
description = "Standalone storage and query engine for OpenGWAS-scale summary statistic stores"
readme = "README.md"
# zarr-python 3.4 (the version #244 moves to) requires Python >=3.12 and
# numpy >=2.  The old floor of 3.11 cannot resolve it, so the floor moves with
# the dependency; see CHANGELOG.md.
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "OpenGWASDB contributors" }
]
dependencies = [
  "numpy>=1.26,<2.5",
  "zarr>=3.4,<4",
  # 0.17 is the first numcodecs that locks Blosc's global context on decompress
  # as well as compress; the seam's threaded decoding relies on it (#244).
  "numcodecs>=0.17",
  "pysam>=0.22",
  "typer>=0.12",
  "scipy>=1.11",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pyliftover>=0.4",
  "threadpoolctl>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-xdist>=3.6",
  "ruff>=0.6",
  "mypy>=1.10",
  "lizard>=1.17",
]

[project.scripts]
opengwasdb = "opengwasdb.cli.main:app"

# -----------------------------------------------------------------------------
# Version from tags (issue #333).
#
# Every merge to `main` is tagged vX.Y.Z by `.github/workflows/release.yml`, and
# the package reads its version from that tag: a release checkout reports
# `0.3.0`; a checkout past the tag reports `0.3.1.dev4+g1a2b3c4`; a checkout
# with no git metadata at all reports `0.0.0+unknown`, which cannot be mistaken
# for a release (see `opengwasdb/version.py`).
#
# `tag_regex` is pinned to `v*` rather than left at setuptools-scm's default,
# which would also accept a bare `0.3.0` tag: one tag convention, checked.
# `fallback_version` is the value used when there is no repository to read, and
# it is the same sentinel `opengwasdb.version.FALLBACK_VERSION` carries, so a
# wheel built without git metadata and a run without installed metadata agree
# (tests/test_version.py holds the two together).
#
# The local scheme is setuptools-scm's default, `node-and-date`, on purpose:
# a clean checkout past the tag carries the commit alone (`+g1a2b3c4`), so the
# version is stable for as long as the code is, while a dirty working tree
# gains the date (`+g1a2b3c4.d20261029`) to say the build is not from that
# commit. Pinning that here keeps the intent visible; there is no
# node-only scheme to choose instead.
# -----------------------------------------------------------------------------
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0+unknown"
tag_regex = "^v(?P<version>.*)$"
local_scheme = "node-and-date"

# `tag_regex` restricts what can be *parsed*; it does not restrict what `git
# describe` *selects*. A stray tag such as `99.0.0` on `HEAD` was chosen by
# describe's default glob and then failed to parse, so the build died instead of
# using the newest `v*` tag (issue #333 review). The match glob is therefore
# configured too, and tests/test_version.py runs this exact command in a
# throwaway repository to show it ignores the stray tag.
[tool.hatch.version.raw-options.scm.git]
describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--abbrev=40", "--match", "v*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# `quality/` is the cleat quality-gate tooling, vendored in whole. It carries
# its own baselines and is not written to this project's rule selection, so
# linting it says nothing about this project's code -- it only buried the real
# count (1,735 findings against a project total of 61, which made
# `scripts/check_baselines.py` useless). `extend-exclude` rather than
# `exclude`, which would drop Ruff's own defaults; `force-exclude` so the
# directory stays excluded when a path inside it is passed explicitly, as
# pre-commit and editor integrations do.
extend-exclude = ["quality"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# The floor is Python 3.12 with the zarr 3.4 pin (#244), and zarr-python 3.4 uses
# PEP 695 type-parameter syntax, which mypy cannot parse under a 3.11 target.
# Moving the target from 3.11 changed no finding: the 39 are the same, line for
# line.
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["numcodecs", "pandas", "pysam", "zarr"]
ignore_missing_imports = true

# zarr 2.18 shipped no `py.typed`, so mypy treated every `zarr.Array`/
# `zarr.Group` as `Any`, and the package's baseline (39 findings) was measured
# that way.  zarr 3.4 *is* typed, and `Group.__getitem__` returns
# `Array | Group`.  Following zarr's types gives 192 findings, 153 more than
# the baseline, measured 5 Oct 2026 at python_version 3.12:
# - 111 of them are in opengwasdb/query/facade.py;
# - most are `union-attr`, `arg-type` and `index`.
# That is a typing refactor of the read paths, outside a dependency-bump ticket.
#
# Decision (#244 review, finding 4): keep `follow_imports = "skip"` for zarr,
# so the baseline stays a real pre-upgrade comparison.
# - What it costs: mypy sees zarr as `Any` and passes a misspelt or removed
#   zarr call.
# - Bounded where zarr meets the Store format: tests/test_seam_types.py
#   type-checks opengwasdb/store/arrays.py with zarr's types followed and
#   requires zero findings.  Its first run found the seam accepting mode "x",
#   which zarr 3 rejects.
# - Tracked: #245 and #247 rewrite the read and write paths for Zarr v3, and
#   adopt zarr's types there with the fixes that need.  Lift the skip when the
#   followed count is within the baseline.
#
# Scoped to zarr alone: skipping pysam would make its existing
# `# type: ignore[call-arg]` comments unused and *add* findings.
[[tool.mypy.overrides]]
module = ["zarr"]
follow_imports = "skip"

# -----------------------------------------------------------------------------
# Pixi (environment + native tool management; see opengwasdb-stores' pixi.toml
# for the sibling repo this mirrors). bcftools is a real runtime dependency of
# opengwasdb.build.vcf_source and has no PyPI wheel, so it is declared here as
# a conda dependency rather than left for developers to install by hand.
# -----------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
# pysam is left off the conda dependency list on purpose: it's already a
# [project] dependency, so this editable install pulls it in transitively via
# pip. Declaring it via conda too installs the same compiled extension twice
# into one environment (see opengwasdb-stores' pixi.toml for the same note).
opengwasdb = { path = ".", editable = true }

[tool.pixi.dependencies]
# zarr 3.4 requires python >=3.12 and numpy >=2; the numpy range below already
# admits numpy 2, so it is unchanged (#244).
python = "3.12.*"
numpy = ">=1.26,<2.5"
zarr = ">=3.4,<4"
numcodecs = ">=0.17"  # threaded Blosc needs its decompress lock; see [project] (#244)
typer = ">=0.12"
scipy = ">=1.11"
pandas = ">=2.0"
scikit-learn = ">=1.3"
pyliftover = ">=0.4"
threadpoolctl = ">=3.0"
bcftools = "*"

[tool.pixi.feature.dev.dependencies]
pytest = ">=8"
ruff = ">=0.6"
mypy = ">=1.10"
lizard = ">=1.17"
pytest-xdist = ">=3.6"

# Separate from dev: rendering docs/benchmark-output/*.qmd needs Quarto's
# Jupyter engine (pyyaml, a Jupyter kernel) and matplotlib for the plotting
# cells, none of which contributors running only tests/lint need to install.
[tool.pixi.feature.report.dependencies]
pyyaml = "*"
matplotlib = ">=3.8"
ipykernel = "*"
jupyter_client = "*"
nbclient = "*"
nbformat = "*"
quarto = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
report = { features = ["report"], solve-group = "default" }

[tool.pixi.feature.dev.tasks]
# Keep the suite hermetic and prevent tiny multiprocessing fixtures from
# inheriting a many-threaded BLAS pool. Both otherwise vary with the host.
test = "env PYTHONNOUSERSITE=1 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 pytest -n auto --maxprocesses=12 --dist=loadfile"
lint = "ruff check ."
typecheck = "mypy opengwasdb"
benchmark-indexed-subset = "python benchmarks/benchmark_indexed_subset.py"
