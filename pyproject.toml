[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opengwasdb"
version = "0.3.0"
description = "Standalone storage and query engine for OpenGWAS-scale summary statistic stores"
readme = "README.md"
# zarr-python 3.4 (the version #244 moves to) requires Python >=3.12 and
# numpy >=2.  The old floor of 3.11 cannot resolve it, so the floor moves with
# the dependency; see CHANGELOG.md.
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "OpenGWASDB contributors" }
]
dependencies = [
  "numpy>=1.26,<2.5",
  "zarr>=3.4,<4",
  # 0.17 is the first numcodecs that locks Blosc's global context on decompress
  # as well as compress; the seam's threaded decoding relies on it (#244).
  "numcodecs>=0.17",
  "pysam>=0.22",
  "typer>=0.12",
  "scipy>=1.11",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pyliftover>=0.4",
  "threadpoolctl>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
  "lizard>=1.17",
]

[project.scripts]
opengwasdb = "opengwasdb.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# `quality/` is the cleat quality-gate tooling, vendored in whole. It carries
# its own baselines and is not written to this project's rule selection, so
# linting it says nothing about this project's code -- it only buried the real
# count (1,735 findings against a project total of 61, which made
# `scripts/check_baselines.py` useless). `extend-exclude` rather than
# `exclude`, which would drop Ruff's own defaults; `force-exclude` so the
# directory stays excluded when a path inside it is passed explicitly, as
# pre-commit and editor integrations do.
extend-exclude = ["quality"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# zarr-python 3.4 uses PEP 695 type-parameter syntax, which mypy cannot parse
# under a 3.11 target; the floor is Python 3.12 with the zarr 3.4 pin (#244).
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["numcodecs", "pandas", "pysam", "zarr"]
ignore_missing_imports = true

# zarr 2.18 shipped no `py.typed`, so mypy treated every `zarr.Array`/
# `zarr.Group` as `Any` and the package's baseline (39 findings) was measured
# that way.  zarr 3.4 *is* typed, and `Group.__getitem__` returns
# `Array | Group`, which turns ~160 existing accesses into `union-attr` /
# `arg-type` / `index` errors -- a typing refactor of the read paths, well
# outside a dependency-bump ticket.  `follow_imports = "skip"` keeps zarr
# untyped exactly as before, so the baseline stays a real pre-upgrade
# comparison rather than being raised by the pin change.  #245/#247 can adopt
# zarr's types deliberately, with the fixes that need.  Scoped to zarr alone:
# skipping pysam would make its existing `# type: ignore[call-arg]` comments
# unused and *add* findings.
[[tool.mypy.overrides]]
module = ["zarr"]
follow_imports = "skip"

# -----------------------------------------------------------------------------
# Pixi (environment + native tool management; see opengwasdb-stores' pixi.toml
# for the sibling repo this mirrors). bcftools is a real runtime dependency of
# opengwasdb.build.vcf_source and has no PyPI wheel, so it is declared here as
# a conda dependency rather than left for developers to install by hand.
# -----------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
# pysam is left off the conda dependency list on purpose: it's already a
# [project] dependency, so this editable install pulls it in transitively via
# pip. Declaring it via conda too installs the same compiled extension twice
# into one environment (see opengwasdb-stores' pixi.toml for the same note).
opengwasdb = { path = ".", editable = true }

[tool.pixi.dependencies]
# zarr 3.4 requires python >=3.12 and numpy >=2; the numpy range below already
# admits numpy 2, so it is unchanged (#244).
python = "3.12.*"
numpy = ">=1.26,<2.5"
zarr = ">=3.4,<4"
numcodecs = ">=0.17"  # threaded Blosc needs its decompress lock; see [project] (#244)
typer = ">=0.12"
scipy = ">=1.11"
pandas = ">=2.0"
scikit-learn = ">=1.3"
pyliftover = ">=0.4"
threadpoolctl = ">=3.0"
bcftools = "*"

[tool.pixi.feature.dev.dependencies]
pytest = ">=8"
ruff = ">=0.6"
mypy = ">=1.10"
lizard = ">=1.17"

# Separate from dev: rendering docs/benchmark-output/*.qmd needs Quarto's
# Jupyter engine (pyyaml, a Jupyter kernel) and matplotlib for the plotting
# cells, none of which contributors running only tests/lint need to install.
[tool.pixi.feature.report.dependencies]
pyyaml = "*"
matplotlib = ">=3.8"
ipykernel = "*"
jupyter_client = "*"
nbclient = "*"
nbformat = "*"
quarto = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
report = { features = ["report"], solve-group = "default" }

[tool.pixi.feature.dev.tasks]
test = "pytest"
lint = "ruff check ."
typecheck = "mypy opengwasdb"
