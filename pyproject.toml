[build-system]
# 1.27 is the first hatchling that writes PEP 639 licence metadata
# (`License-Expression`, `License-File`), which the licence below needs.
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "opengwasdb"
dynamic = ["version"]
description = "Standalone storage and query engine for OpenGWAS-scale summary statistic stores"
readme = "README.md"
# zarr-python 3.4 (the version #244 moves to) requires Python >=3.12 and
# numpy >=2.  The old floor of 3.11 cannot resolve it, so the floor moves with
# the dependency; see CHANGELOG.md.
requires-python = ">=3.12"
# GPL-3.0-only, with the University of Bristol holding the copyright (owner's
# ruling, 22 Nov 2026, #452, ADR 0086, which supersedes ADR 0082's Sustainable
# Use License). The text travels in both distributions as LICENSE. No
# `License ::` classifier: PEP 639 forbids one beside a licence expression.
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "OpenGWASDB contributors" }
]
# What is advertised is what CI's installed-wheel job tests (#438); other
# platforms are #441.
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  # The Store Reader: opengwasdb reads Store Releases through it, and
  # opengwasdb.store_reader re-exports it (#475). ogquery needs numpy>=2.0.
  # 0.2 carries the Clumps reads (#418) and the narrowed proof range (#492).
  "ogquery>=0.2,<0.3",
  "numpy>=2.0,<2.5",
  "zarr>=3.4,<4",
  # 0.17 is the first numcodecs that locks Blosc's global context on decompress
  # as well as compress; the seam's threaded decoding relies on it (#244).
  "numcodecs>=0.17",
  "pysam>=0.22",
  "typer>=0.12",
  "scipy>=1.11",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pyliftover>=0.4",
  "threadpoolctl>=3.0",
  # opengwasdb.ld opens an LD Store over HTTP(S) as well as from disk
  # (docs/spec/ld-store.md §2, §10; opengwas/ogld#4). zarr opens a URL through
  # fsspec, whose HTTP filesystem is async and imports aiohttp (#455).
  "fsspec>=2024.12",
  "aiohttp>=3.10",
]

[project.optional-dependencies]
# What opengwasdb.ld builds and imports with, carried over from ogld's `build`
# and `import` extras (#455). pgenlib reads the pgen genotypes an LD Store build
# starts from and the calls a Genotype Store request computes LD from. It is
# imported inside those paths only, so `import opengwasdb.ld` and every LD Store
# read work without it; a Genotype Store read refuses and names this extra.
# ogld's extra also carried threadpoolctl, which caps BLAS's threads for a build;
# here it is a dependency of the package itself (above), so the extra is
# pgenlib alone and a build never lacks threadpoolctl.
ld-build = ["pgenlib>=0.90"]
# Importing a producer's LD (Pan-UKB's LD matrices, opengwasdb.ld.build.importing).
# ogld's extra also carried pyliftover, which is a dependency of the package
# itself here (above), so the extra is lz4 alone.
ld-import = ["lz4>=4"]
dev = [
  "pytest>=8",
  "pytest-xdist>=3.6",
  "ruff>=0.6",
  "mypy>=1.10",
  "lizard>=1.17",
  # Same list as the pixi `dev` feature ([tool.pixi.feature.dev.dependencies]
  # and its pypi-dependencies), which is how a contributor gets this environment;
  # `pip install -e .[dev]` is the other way in, and it must not be a way in that
  # runs less of the suite. So it carries the one dependency the architecture
  # model's check reads (docs/architecture/components.yaml, issue #358), and
  # what tests/ld needs (#455): ogld's 5 s per-test timeout, its property tests,
  # the Test Panel's pgen reader (the `ld-build` extra) and the import fixtures'
  # decompressor (the `ld-import` extra), so nothing there skips or errors.
  "pyyaml>=6",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "pgenlib>=0.90",
  "lz4>=4",
]

[project.scripts]
opengwasdb = "opengwasdb.cli.main:app"

[project.urls]
Homepage = "https://github.com/opengwas/opengwasdb"
Documentation = "https://blog.opengwas.io/opengwasdb/"
Repository = "https://github.com/opengwas/opengwasdb"
Issues = "https://github.com/opengwas/opengwasdb/issues"
Changelog = "https://github.com/opengwas/opengwasdb/releases"

# -----------------------------------------------------------------------------
# Distribution contents (#438).
#
# The wheel is the package directory: hatchling finds `opengwasdb/` and takes
# every file git tracks under it, Python and reader column maps alike, so it
# needs no list. The source archive defaults to the whole repository -- 21.7 MiB
# at v0.9.0, mostly benchmark documents -- so it is listed: the package, and
# what a wheel build from it reads. hatchling adds pyproject.toml, PKG-INFO and
# the licence itself. scripts/check_distributions.py holds both archives to
# this, and CI runs it on every pull request.
# -----------------------------------------------------------------------------
[tool.hatch.build.targets.sdist]
include = ["/opengwasdb", "/README.md", "/LICENSE"]

# -----------------------------------------------------------------------------
# Version from tags (issue #333).
#
# Every merge to `main` is tagged vX.Y.Z by `.github/workflows/release.yml`, and
# the package reads its version from that tag: a release checkout reports
# `0.3.0`; a checkout past the tag reports `0.3.1.dev4+g1a2b3c4`; a checkout
# with no git metadata at all reports `0.0.0+unknown`, which cannot be mistaken
# for a release (see `opengwasdb/version.py`).
#
# `tag_regex` is pinned to `v*` rather than left at setuptools-scm's default,
# which would also accept a bare `0.3.0` tag: one tag convention, checked.
# `fallback_version` is the value used when there is no repository to read, and
# it is the same sentinel `opengwasdb.version.FALLBACK_VERSION` carries, so a
# wheel built without git metadata and a run without installed metadata agree
# (tests/test_version.py holds the two together).
#
# The local scheme is setuptools-scm's default, `node-and-date`, on purpose:
# a clean checkout past the tag carries the commit alone (`+g1a2b3c4`), so the
# version is stable for as long as the code is, while a dirty working tree
# gains the date (`+g1a2b3c4.d20261029`) to say the build is not from that
# commit. Pinning that here keeps the intent visible; there is no
# node-only scheme to choose instead.
# -----------------------------------------------------------------------------
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0+unknown"
tag_regex = "^v(?P<version>.*)$"
local_scheme = "node-and-date"

# `tag_regex` restricts what can be *parsed*; it does not restrict what `git
# describe` *selects*. A stray tag such as `99.0.0` on `HEAD` was chosen by
# describe's default glob and then failed to parse, so the build died instead of
# using the newest `v*` tag (issue #333 review). The match glob is therefore
# configured too, and tests/test_version.py runs this exact command in a
# throwaway repository to show it ignores the stray tag.
[tool.hatch.version.raw-options.scm.git]
describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--abbrev=40", "--match", "v*"]

# Test tiers and areas (#455, #459). `ld` is an area: every test under tests/ld/
# carries it, by directory (tests/ld/conftest.py), so `-m ld` is opengwasdb.ld's
# suite and `-m "not ld"` is the engine's. The default run is every test with
# neither opt-in mark: `realdata` reads the HGDP+1kGP panels under
# /data/opengwasdb/reference/ and runs only on the IEU compute nodes, through
# `pixi run -e dev ld-test-realdata`; `acceptance` is the whole-panel runs of
# `ld-acceptance-*`. The opt-in tiers are deselected in tests/conftest.py, not
# by an `addopts` `-m`, because a command line's `-m` replaces that one and
# `-m ld` would bring them back; `-m realdata` still asks for one. `--strict-markers`
# makes a misspelt mark an error rather than a test that runs in no tier. ogld's
# 5 s timeout and `xfail_strict` apply to tests/ld/ only, from tests/ld/conftest.py.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
  "ld: an opengwasdb.ld test; added to every test under tests/ld/, so `-m ld` and `-m \"not ld\"` select the area",
  "acceptance: an opengwasdb.ld acceptance run on a whole panel, slower than the realdata tier; run by `pixi run -e dev ld-acceptance-clump`, `ld-acceptance-stores` and `ld-acceptance-genotypes`",
  "realdata: reads the HGDP+1kGP panels under /data/opengwasdb/reference/; IEU nodes only, run by `pixi run -e dev ld-test-realdata`",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# `quality/` is the cleat quality-gate tooling, vendored in whole. It carries
# its own baselines and is not written to this project's rule selection, so
# linting it says nothing about this project's code -- it only buried the real
# count (1,735 findings against a project total of 61, which made
# `scripts/check_baselines.py` useless). `extend-exclude` rather than
# `exclude`, which would drop Ruff's own defaults; `force-exclude` so the
# directory stays excluded when a path inside it is passed explicitly, as
# pre-commit and editor integrations do.
extend-exclude = ["quality"]
force-exclude = true
# opengwasdb.ld came from ogld (#455), which targeted py312 and uses its syntax
# (`type` aliases, PEP 695 type parameters). The package requires 3.12, so the
# syntax is sound; moving the whole project to py312 instead would add 22
# UP046/UP047 findings in opengwasdb's own code.
per-file-target-version = { "opengwasdb/ld/**" = "py312", "tests/ld/**" = "py312", "scripts/ld/**" = "py312" }

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# `opengwasdb.store_reader` re-exports `ogquery` module for module (#475): a star import is
# the whole of such a module, and an import nothing uses is what it is for. One entry per
# re-export, so `facade.py` and `rho.py`, which are real code until #495, stay linted;
# `tests/test_store_reader_is_ogquery.py` holds this list to the files that are re-exports.
"opengwasdb/store_reader/__init__.py" = ["F401", "F403"]
"opengwasdb/store/query_digests.py" = ["F401", "F403"]
"opengwasdb/store_reader/alid.py" = ["F401", "F403"]
"opengwasdb/store_reader/alid_index.py" = ["F401", "F403"]
"opengwasdb/store_reader/alid_sidecar.py" = ["F401", "F403"]
"opengwasdb/store_reader/analyses.py" = ["F401", "F403"]
"opengwasdb/store_reader/arrays.py" = ["F401", "F403"]
"opengwasdb/store_reader/assembly.py" = ["F401", "F403"]
"opengwasdb/store_reader/associations/__init__.py" = ["F401", "F403"]
"opengwasdb/store_reader/associations/cells.py" = ["F401", "F403"]
"opengwasdb/store_reader/associations/csr.py" = ["F401", "F403"]
"opengwasdb/store_reader/associations/dense.py" = ["F401", "F403"]
"opengwasdb/store_reader/associations/record.py" = ["F401", "F403"]
"opengwasdb/store_reader/associations/subset.py" = ["F401", "F403"]
"opengwasdb/store_reader/by_variant.py" = ["F401", "F403"]
"opengwasdb/store_reader/csr.py" = ["F401", "F403"]
"opengwasdb/store_reader/encoding/__init__.py" = ["F401", "F403"]
"opengwasdb/store_reader/encoding/codec.py" = ["F401", "F403"]
"opengwasdb/store_reader/encoding/plan.py" = ["F401", "F403"]
"opengwasdb/store_reader/encoding/planes.py" = ["F401", "F403"]
"opengwasdb/store_reader/enums.py" = ["F401", "F403"]
"opengwasdb/store_reader/format.py" = ["F401", "F403"]
"opengwasdb/store_reader/hybrid.py" = ["F401", "F403"]
"opengwasdb/store_reader/identity.py" = ["F401", "F403"]
"opengwasdb/store_reader/indexed.py" = ["F401", "F403"]
"opengwasdb/store_reader/layout.py" = ["F401", "F403"]
"opengwasdb/store_reader/manifest.py" = ["F401", "F403"]
"opengwasdb/store_reader/npy_sidecar.py" = ["F401", "F403"]
"opengwasdb/store_reader/panel_axis.py" = ["F401", "F403"]
"opengwasdb/store_reader/position_sidecar.py" = ["F401", "F403"]
"opengwasdb/store_reader/release.py" = ["F401", "F403"]
"opengwasdb/store_reader/resolve.py" = ["F401", "F403"]
"opengwasdb/store_reader/rsid_index.py" = ["F401", "F403"]
"opengwasdb/store_reader/source_alid_sidecar.py" = ["F401", "F403"]
"opengwasdb/store_reader/stats.py" = ["F401", "F403"]
"opengwasdb/store_reader/stored.py" = ["F401", "F403"]
"opengwasdb/store_reader/top_hits.py" = ["F401", "F403"]
"opengwasdb/store_reader/variant_axis.py" = ["F401", "F403"]

[tool.mypy]
# The floor is Python 3.12 with the zarr 3.4 pin (#244), and zarr-python 3.4 uses
# PEP 695 type-parameter syntax, which mypy cannot parse under a 3.11 target.
# Moving the target from 3.11 changed no finding: the 39 are the same, line for
# line.
python_version = "3.12"
strict = true

# `store.query_digests` star-imports `ogquery.digests` and overrides two of its functions
# (#475); mypy reads the override as a redefinition. Only that code, only that module.
[[tool.mypy.overrides]]
module = ["opengwasdb.store.query_digests"]
disable_error_code = ["no-redef"]

[[tool.mypy.overrides]]
module = ["numcodecs", "pandas", "pysam", "zarr"]
ignore_missing_imports = true

# opengwasdb.ld's optional dependencies ship no stubs and no py.typed marker.
[[tool.mypy.overrides]]
module = ["pgenlib", "threadpoolctl", "lz4.*", "pyliftover"]
ignore_missing_imports = true

# zarr 2.18 shipped no `py.typed`, so mypy treated every `zarr.Array`/
# `zarr.Group` as `Any`, and the package's baseline (39 findings) was measured
# that way.  zarr 3.4 *is* typed, and `Group.__getitem__` returns
# `Array | Group`.  Following zarr's types gives 192 findings, 153 more than
# the baseline, measured 5 Oct 2026 at python_version 3.12:
# - 111 of them are in opengwasdb/query/facade.py;
# - most are `union-attr`, `arg-type` and `index`.
# That is a typing refactor of the read paths, outside a dependency-bump ticket.
#
# Decision (#244 review, finding 4): keep `follow_imports = "skip"` for zarr,
# so the baseline stays a real pre-upgrade comparison.
# - What it costs: mypy sees zarr as `Any` and passes a misspelt or removed
#   zarr call.
# - Bounded where zarr meets the Store format: tests/test_seam_types.py
#   type-checks opengwasdb/store/arrays.py with zarr's types followed and
#   requires zero findings.  Its first run found the seam accepting mode "x",
#   which zarr 3 rejects.
# - Tracked: #245 and #247 rewrite the read and write paths for Zarr v3, and
#   adopt zarr's types there with the fixes that need.  Lift the skip when the
#   followed count is within the baseline.
#
# Scoped to zarr alone: skipping pysam would make its existing
# `# type: ignore[call-arg]` comments unused and *add* findings.
[[tool.mypy.overrides]]
module = ["zarr"]
follow_imports = "skip"

# -----------------------------------------------------------------------------
# Pixi (environment + native tool management; see opengwasdb-stores' pixi.toml
# for the sibling repo this mirrors). bcftools is a real runtime dependency of
# opengwasdb.build.vcf_source and has no PyPI wheel, so it is declared here as
# a conda dependency rather than left for developers to install by hand.
# -----------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
# pysam is left off the conda dependency list on purpose: it's already a
# [project] dependency, so this editable install pulls it in transitively via
# pip. Declaring it via conda too installs the same compiled extension twice
# into one environment (see opengwasdb-stores' pixi.toml for the same note).
opengwasdb = { path = ".", editable = true }
# ogquery is on PyPI only; the editable install above would pull it in, but
# naming it keeps the pin visible beside the conda dependencies (#475).
ogquery = ">=0.2,<0.3"

[tool.pixi.dependencies]
# zarr 3.4 requires python >=3.12 and numpy >=2 (#244); ogquery, the Store
# Reader, needs numpy >=2.0 too (#475).
python = "3.12.*"
numpy = ">=2.0,<2.5"
zarr = ">=3.4,<4"
numcodecs = ">=0.17"  # threaded Blosc needs its decompress lock; see [project] (#244)
typer = ">=0.12"
scipy = ">=1.11"
pandas = ">=2.0"
scikit-learn = ">=1.3"
pyliftover = ">=0.4"
threadpoolctl = ">=3.0"
fsspec = ">=2024.12"  # opengwasdb.ld reads an LD Store over HTTP(S); see [project]
aiohttp = ">=3.10"
bcftools = "*"

[tool.pixi.feature.dev.dependencies]
pytest = ">=8"
ruff = ">=0.6"
mypy = ">=1.10"
lizard = ">=1.17"
pytest-xdist = ">=3.6"
# tests/architecture_model.py reads docs/architecture/components.yaml (issue #358).
# PyYAML reaches the dev environment today only as somebody else's dependency, so
# the model's check would break on a resolution that drops it, and the fix would
# look like it belonged to that other package.
pyyaml = "*"
# opengwasdb.ld's tests (#455): ogld's 5 s per-test timeout, its property tests,
# and the `ld-import` extra, so import fixture tests run rather than skip.
pytest-timeout = ">=2.3"
hypothesis = ">=6.100"
lz4 = ">=4"

# pgenlib is PyPI-only. The dev environment carries the `ld-build` extra so the
# suite reads the Test Panel's pgen and never skips (#455).
[tool.pixi.feature.dev.pypi-dependencies]
pgenlib = ">=0.90"

# Separate from dev: rendering docs/benchmark-output/*.qmd needs Quarto's
# Jupyter engine (pyyaml, a Jupyter kernel) and matplotlib for the plotting
# cells, none of which contributors running only tests/lint need to install.
[tool.pixi.feature.report.dependencies]
pyyaml = "*"
matplotlib = ">=3.8"
ipykernel = "*"
jupyter_client = "*"
nbclient = "*"
nbformat = "*"
quarto = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
report = { features = ["report"], solve-group = "default" }

[tool.pixi.feature.dev.tasks]
# Keep the suite hermetic and prevent tiny multiprocessing fixtures from
# inheriting a many-threaded BLAS pool. Both otherwise vary with the host.
test = "env PYTHONNOUSERSITE=1 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 pytest -n auto --maxprocesses=12 --dist=loadfile"
lint = "ruff check ."
typecheck = "mypy opengwasdb"
# The Store Reader contract bundle is current: regenerated byte for byte, and the six
# format-parity cases `test` leaves out (#474; CONTRIBUTING.md, Test tiers).
contract-check = "env PYTHONNOUSERSITE=1 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python scripts/check_store_reader_contract.py"
benchmark-indexed-subset = "python benchmarks/benchmark_indexed_subset.py"
# opengwasdb.ld's realdata tier: the IEU nodes only (#455; ogld's `test-realdata`).
# run.sh names every suite it runs.
ld-test-realdata = "env PYTHONNOUSERSITE=1 bash tests/ld/realdata/run.sh"
# The whole-panel comparison of `clump` with plink2: about an hour.
ld-acceptance-clump = "env PYTHONNOUSERSITE=1 bash tests/ld/acceptance/run.sh"
# The five HGDP+1kGP LD Stores: every validation rule, and the provenance each records.
ld-acceptance-stores = "env PYTHONNOUSERSITE=1 bash tests/ld/acceptance/run_stores.sh"
# The whole-panel comparison of the Genotype Store with the LD Store, code for code.
ld-acceptance-genotypes = "env PYTHONNOUSERSITE=1 bash tests/ld/acceptance/run_genotypes.sh"
# ogld#8's read-latency benchmark, from local disk and over HTTP (docs/benchmarks/ld/latency.md):
# `pixi run -e dev ld-bench-latency step1 --target local http0 http10 http50 --out …`. BLAS keeps one
# thread and zarr's pool `--zarr-threads`, so a timing stays within the shared node's 8 threads.
ld-bench-latency = "env PYTHONNOUSERSITE=1 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python scripts/ld/bench/latency.py"
# ogld#9's serving measurements (docs/benchmarks/ld/serving.md): `pixi run -e dev ld-bench-serving memory
# --out …`, `lag --out …`, and `tables docs/benchmarks/ld/results/9/*.jsonl.gz`. BLAS keeps one
# thread, as for ld-bench-latency, and the records carry it.
ld-bench-serving = "env PYTHONNOUSERSITE=1 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python scripts/ld/bench/serving.py"
